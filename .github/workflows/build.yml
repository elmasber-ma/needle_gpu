name: build

# Cada push dispara el build completo (APK + Rust + Gradle).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # DESHABILITADOS temporalmente (el CI solo compila Android por ahora).
          # Para reactivar: quita el comentario y borra la línea "android".
          # - target: linux
          #   os: ubuntu-latest
          #   command: flutter build linux --release
          # - target: windows
          #   os: windows-latest
          #   command: flutter build windows --release
          - target: android
            os: ubuntu-latest
            # Solo arm64: sin esto Flutter pasa los 3 ABIs a Gradle y
            # Cargokit compila Rust 3 veces (armv7 incluido).
            command: flutter build apk --release --target-platform android-arm64

    steps:
      - name: Free disk space
        if: matrix.target == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          df -h

      - uses: actions/checkout@v5

      - name: Install Linux desktop deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Toolchain Rust mínima para codegen (cargo-expand la necesita);
      # el build pesado de crates viene después del gate de análisis.
      - uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------- cache
      - name: Cache Dart pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache cargo-expand binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-v1

      - name: Cache Gradle
        if: matrix.target == 'android'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache flutter_rust_bridge_codegen
        id: codegen-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/flutter_rust_bridge_codegen
          key: codegen-${{ runner.os }}-2.12.0

      # ---------------------------------------------------- codegen binary
      - name: Install codegen (Linux)
        if: runner.os == 'Linux' && steps.codegen-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.12.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.12.0.tgz" -o "$RUNNER_TEMP/frb.tgz"
          tar -xzf "$RUNNER_TEMP/frb.tgz" -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/flutter_rust_bridge_codegen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install codegen (Windows)
        if: runner.os == 'Windows' && steps.codegen-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME\.local\bin" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.12.0/flutter_rust_bridge_codegen-x86_64-pc-windows-msvc-v2.12.0.zip" -OutFile "$env:RUNNER_TEMP/frb.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/frb.zip" -DestinationPath "$HOME/.local/bin" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME/.local/bin"

      - name: Ensure codegen in PATH
        if: steps.codegen-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------- dart + codegen
      - name: Fetch Dart packages
        run: flutter pub get

      - name: Install cargo-expand (needed by codegen)
        run: |
          if ! command -v cargo-expand > /dev/null 2>&1; then
            cargo install cargo-expand
          fi

      - name: Generate Rust <-> Dart bindings
        run: flutter_rust_bridge_codegen generate

      # FAIL FAST: análisis Dart ANTES del build pesado (NDK, wgpu, Gradle).
      # Un error de sintaxis/tipos cuesta ~4 min en vez de 20+.
      # Los warnings no cortan el build; solo los errores.
      - name: Analyze Dart (fail fast)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ------------------------------------------------------------- build
      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses and install NDK
        if: matrix.target == 'android'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" > /dev/null 2>&1 || true

      - name: Enable Windows desktop
        if: matrix.target == 'windows'
        run: flutter config --enable-windows-desktop

      - name: Build ${{ matrix.target }}
        run: ${{ matrix.command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: needle_gpu-${{ matrix.target }}
          path: |
            build/windows/x64/runner/Release/**/*
            build/linux/x64/release/bundle/**/*
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
