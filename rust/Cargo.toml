[package]
name = "rust_lib_needle_gpu"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
needle-infer = { version = "0.2.1", features = ["parallel"] }
needle-core = "0.2.1"
wgpu = "25"
half = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
